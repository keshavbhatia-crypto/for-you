<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffb199);
}

.container{
    text-align:center;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(15px);
    padding:50px;
    border-radius:20px;
    color:white;
    width:90%;
    max-width:650px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    font-size:3rem;
    margin-bottom:20px;
}

p{
    font-size:1.3rem;
    line-height:1.6;
}

.buttons{
    margin-top:35px;
    position:relative;
    height:100px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:40px;
    font-size:20px;
    cursor:pointer;
    transition:.3s;
}

#yes{
    background:#ff2d55;
    color:white;
    margin-right:20px;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:white;
    color:#ff2d55;
    position:absolute;
}

.heart{
    position:absolute;
    color:white;
    font-size:25px;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }
    to{
        transform:translateY(-120vh) scale(1.5);
        opacity:1;
    }
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="container">
    <h1>Hey ❤️</h1>

    <p>
       

        I don't know what the future holds,
        but I'd love to find out with you.
    </p>

    <h2 style="margin-top:30px;">
        Will you be my girlfriend? 💖
    </h2>

    <div class="buttons">
        <button id="yes">YES ❤️</button>
        <button id="no">No 😅</button>
    </div>
</div>

<script>
// Floating Hearts
for(let i=0;i<40;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*5)+"s";
    heart.style.fontSize=(15+Math.random()*30)+"px";
    document.body.appendChild(heart);
}

// No Button Escape
const no=document.getElementById("no");

no.addEventListener("mouseover",()=>{
    no.style.left=Math.random()*350+"px";
    no.style.top=Math.random()*60+"px";
});

// Confetti
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function confetti(){

for(let i=0;i<250;i++){
particles.push({
x:canvas.width/2,
y:canvas.height/2,
dx:(Math.random()-0.5)*10,
dy:(Math.random()-0.5)*10,
size:Math.random()*8+2,
color:`hsl(${Math.random()*360},100%,60%)`
});
}

animate();
}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach((p,index)=>{

p.x+=p.dx;
p.y+=p.dy;
p.dy+=0.08;

ctx.fillStyle=p.color;
ctx.fillRect(p.x,p.y,p.size,p.size);

if(p.y>canvas.height){
particles.splice(index,1);
}

});

requestAnimationFrame(animate);
}

document.getElementById("yes").onclick=()=>{

confetti();

setTimeout(()=>{
alert("YAY!! ❤️\nYou just made me the happiest person alive!");
},500);

};
</script>

</body>
</html>
